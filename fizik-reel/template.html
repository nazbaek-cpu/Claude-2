<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Jakarta"; font-weight: 600; src: url("assets/fonts/pjs-600.woff2") format("woff2"); }
  @font-face { font-family: "Jakarta"; font-weight: 800; src: url("assets/fonts/pjs-800.woff2") format("woff2"); }
  :root { --yellow: #FFE45C; --pink: #FF6B81; --mint: #7DF7D2; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: #000; overflow: hidden; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Jakarta", sans-serif; color: #fff; }
  #aroll { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* ---------- liquid glass ---------- */
  .glass {
    position: relative; overflow: hidden; border-radius: 44px;
    background:
      radial-gradient(120% 90% at 15% 0%, rgba(255,255,255,.34) 0%, rgba(255,255,255,0) 55%),
      linear-gradient(160deg, rgba(255,255,255,.20) 0%, rgba(255,255,255,.06) 50%, rgba(255,255,255,.14) 100%),
      rgba(16, 20, 26, .26);
    -webkit-backdrop-filter: blur(22px) saturate(1.8) brightness(1.06);
    backdrop-filter: blur(22px) saturate(1.8) brightness(1.06);
    border: 1.5px solid rgba(255,255,255,.55);
    box-shadow:
      inset 0 2px 1px rgba(255,255,255,.85),
      inset 0 -3px 2px rgba(255,255,255,.22),
      inset 0 0 30px rgba(255,255,255,.10),
      0 26px 60px rgba(0,0,0,.38);
    text-shadow: 0 2px 12px rgba(0,0,0,.35);
  }
  .glass::after { /* rim refraction */
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 18%, rgba(255,255,255,0) 82%, rgba(255,255,255,.18));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; padding: 3px;
  }
  .sheen { position: absolute; inset: -20% -10%; pointer-events: none;
    background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.42) 50%, transparent 62%);
    transform: translateX(-130%); }

  .cue { position: absolute; display: none; }
  .cue.top { top: 96px; left: 60px; right: 60px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .cue.free { inset: 0; }
  .cue.free .hero { position: absolute; top: 96px; left: 50%; }
  .cue.ctaz { left: 60px; right: 60px; top: 1330px; display: flex; flex-direction: column; align-items: center; gap: 26px; }

  .hero { display: flex; align-items: center; gap: 26px; padding: 26px 50px; border-radius: 56px; }
  .hero.col { flex-direction: column; gap: 4px; padding: 30px 60px 34px; }
  .card { display: flex; align-items: center; gap: 28px; padding: 30px 44px; max-width: 960px; }
  .pill { display: inline-flex; align-items: center; gap: 18px; padding: 16px 40px 16px 26px; border-radius: 999px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 16px 34px; border-radius: 999px; font-weight: 800; font-size: 48px; white-space: nowrap; }
  .cue.free .chip { position: absolute; }
  .row { display: flex; gap: 20px; }
  .list { padding: 30px 48px 34px; min-width: 700px; display: flex; flex-direction: column; gap: 14px; }
  .li { display: flex; align-items: center; gap: 20px; font-weight: 800; font-size: 54px; }

  .kicker { font-weight: 800; font-size: 30px; letter-spacing: .32em; opacity: .85; }
  .huge { font-weight: 800; font-size: 140px; line-height: .95; letter-spacing: -.02em; }
  .sm { font-weight: 600; font-size: 44px; opacity: .95; }
  .lg { font-weight: 800; font-size: 64px; line-height: 1.08; letter-spacing: -.01em; }
  .txt { display: flex; flex-direction: column; gap: 2px; }
  .ico { flex: none; filter: drop-shadow(0 6px 14px rgba(0,0,0,.35)); }
  .glow { text-shadow: 0 0 22px currentColor, 0 2px 12px rgba(0,0,0,.4); }

  .cta { padding: 34px 70px; border-radius: 999px; font-weight: 800; font-size: 62px; letter-spacing: .02em; color: var(--yellow);
    background:
      radial-gradient(120% 90% at 15% 0%, rgba(255,255,255,.30) 0%, rgba(255,255,255,0) 55%),
      rgba(12, 14, 18, .55); }
  .pill2 { display: inline-flex; align-items: center; gap: 14px; font-weight: 800; font-size: 46px; text-shadow: 0 3px 14px rgba(0,0,0,.6); }
  .cursor { position: absolute; left: 640px; top: 90px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)); }
  .ring { position: absolute; left: 650px; top: 95px; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
    border: 5px solid rgba(255,255,255,.9); opacity: 0; }

  /* numbered step badge and coloured operator badge */
  .num { display:inline-flex; align-items:center; justify-content:center; width:62px; height:62px; border-radius:50%;
    background: rgba(255,255,255,.22); border:1.5px solid rgba(255,255,255,.55); font-size:36px; flex:none; }
  .sym { display:inline-flex; align-items:center; justify-content:center; width:58px; height:58px; margin-right:14px; border-radius:50%;
    color:#fff; font-size:46px; line-height:1; box-shadow: inset 0 2px 1px rgba(255,255,255,.5); flex:none; }
  /* count-up number: GSAP tweens --n (snapped to integers), CSS prints it; no JS callbacks so seeking is exact */
  .count { counter-reset: n calc(var(--n)); }
  .count::after { content: counter(n); }

  /* ---------- captions ---------- */
  .caps { position: absolute; left: 60px; right: 60px; top: 1440px; height: 140px; display: flex; justify-content: center; }
  .cap { position: absolute; display: none; padding: 18px 40px 22px; border-radius: 34px; font-weight: 800; font-size: 56px; white-space: nowrap;
    background: linear-gradient(160deg, rgba(255,255,255,.18), rgba(255,255,255,.05)), rgba(10,12,16,.34);
    -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6);
    border: 1.5px solid rgba(255,255,255,.42);
    box-shadow: inset 0 2px 1px rgba(255,255,255,.7), 0 18px 40px rgba(0,0,0,.3);
    text-shadow: 0 2px 10px rgba(0,0,0,.4); }
  .cap .w { opacity: .5; }
  .cap .w.k { color: var(--yellow); }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-start="0" data-duration="{{DUR}}">
  <video id="aroll" class="clip" src="assets/base.mp4" muted playsinline data-start="0" data-duration="{{DUR}}"></video>
  <audio id="mix" src="assets/mix.wav" data-start="0" data-duration="{{DUR}}"></audio>
{{CUES}}
  <div class="caps">
{{CAPS}}
  </div>
</div>
<script src="assets/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  const num = (el, k) => parseFloat(el.dataset[k]);
  tl.set({}, {}, {{DUR}});

  document.querySelectorAll(".cue").forEach((c) => {
    const t0 = num(c, "t0"), t1 = num(c, "t1");
    const disp = c.classList.contains("free") ? "block" : "flex";
    tl.set(c, { display: disp }, t0);
    tl.set(c, { display: "none" }, t1 + 0.02);
    tl.to(c, { autoAlpha: 0, y: -26, scale: 0.97, duration: 0.26, ease: "power2.in" }, Math.max(t0 + 0.3, t1 - 0.26));
    c.querySelectorAll(".pop").forEach((el) => {
      const t = Math.max(t0, num(el, "at"));
      const isGlass = el.classList.contains("glass");
      const from = { autoAlpha: 0, y: 46, scale: isGlass ? 0.82 : 0.9 };
      const to = { autoAlpha: 1, y: 0, scale: 1, duration: isGlass ? 0.5 : 0.36, ease: isGlass ? "back.out(1.7)" : "back.out(2.2)" };
      if (!isGlass) { from.filter = "blur(10px)"; to.filter = "blur(0px)"; }
      if (el.classList.contains("hero") && el.closest(".free")) { from.xPercent = -50; to.xPercent = -50; }
      tl.fromTo(el, from, to, t);
      const sh = el.querySelector(":scope > .sheen");
      if (sh) tl.fromTo(sh, { xPercent: -130 }, { xPercent: 130, duration: 1.0, ease: "power2.inOut" }, t + 0.15);
      if (el.classList.contains("shake")) tl.to(el, { x: 9, duration: 0.05, repeat: 7, yoyo: true, ease: "none" }, t + 0.36);
      if (el.classList.contains("float")) tl.to(el, { y: -14, duration: 1.1, repeat: 3, yoyo: true, ease: "sine.inOut" }, t + 0.5);
    });
    c.querySelectorAll(".count").forEach((el) => {
      const t = Math.max(t0, num(el, "at"));
      tl.set(el, { "--n": 0 }, 0);
      tl.to(el, { "--n": parseFloat(el.dataset.to), duration: 1.4, ease: "power2.out", snap: { "--n": 1 } }, t);
    });
    c.querySelectorAll(".bob").forEach((el) => tl.to(el, { y: 14, duration: 0.35, repeat: 5, yoyo: true, ease: "sine.inOut" }, t0 + 0.6));
    const cur = c.querySelector(".cursor");
    if (cur) {
      const t = num(cur, "at");
      tl.fromTo(cur, { autoAlpha: 0, x: 300, y: 260 }, { autoAlpha: 1, x: 0, y: 0, duration: 0.45, ease: "power3.out" }, t);
      tl.to(cur, { scale: 0.82, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "10% 10%" }, t + 0.5);
      const ring = c.querySelector(".ring");
      tl.fromTo(ring, { autoAlpha: 1, scale: 0.2 }, { autoAlpha: 0, scale: 2.4, duration: 0.5, ease: "power2.out" }, t + 0.5);
      tl.to(c.querySelector(".cta"), { scale: 0.94, duration: 0.08, yoyo: true, repeat: 1 }, t + 0.5);
    }
  });

  document.querySelectorAll(".cap").forEach((c) => {
    const t0 = num(c, "t0"), t1 = num(c, "t1");
    tl.set(c, { display: "block" }, t0);
    tl.fromTo(c, { autoAlpha: 0, y: 14, scale: 0.94 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.14, ease: "power2.out" }, t0);
    tl.set(c, { display: "none" }, t1);
    c.querySelectorAll(".w").forEach((w) => tl.to(w, { opacity: 1, duration: 0.08 }, Math.max(t0, num(w, "at"))));
  });

  window.__timelines = window.__timelines || {};
  window.__timelines["root"] = tl;
</script>
</body>
</html>
